name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # - name: Set up Python
    #   uses: actions/setup-python@v5
    #   with:
    #     python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with ruff
      run: |
        ruff check backend/ frontend/

    - name: Run tests with pytest
      run: |
        pytest backend/tests/ --cov=backend --cov-report=term-missing

    - name: Verify application starts
      run: |
        # 1. Запускаем uvicorn и сохраняем объект процесса, чтобы знать его PID
        $process = Start-Process python -ArgumentList "-m", "uvicorn", "backend.main:app", "--port", "8000" -NoNewWindow -PassThru
        
        # 2. Ждем 5 секунд, чтобы приложение успело подняться
        Start-Sleep -Seconds 5
        
        try {
            # 3. Делаем запрос к health endpoint
            $response = Invoke-RestMethod -Uri "http://localhost:8000/health"
            Write-Host "Health check passed: $($response.status)"
        } catch {
            Write-Error "Health check failed"
            # 4. Если упало, всё равно убиваем процесс перед выходом
            if ($process) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            exit 1
        }
        
        # 5. Корректно останавливаем ТОЛЬКО этот конкретный процесс uvicorn
        if ($process) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Write-Host "Uvicorn process stopped successfully."
        }