name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with ruff
      run: |
        ruff check backend/ frontend/

    - name: Run tests with pytest
      run: |
        pytest backend/tests/ --cov=backend --cov-report=term-missing

    - name: Verify application starts
      run: |
        # Запуск uvicorn в фоне
        Start-Process python -ArgumentList "-m", "uvicorn", "backend.main:app", "--port", "8000" -NoNewWindow -PassThru | Out-Null
        Start-Sleep -Seconds 5
        
        # Проверка health endpoint
        try {
            $response = Invoke-RestMethod -Uri "http://localhost:8000/health"
            Write-Host "Health check passed: $($response.status)"
        } catch {
            Write-Error "Health check failed"
            exit 1
        }
        
        # Остановка процесса
        Get-Process -Name python -ErrorAction SilentlyContinue | Stop-Process -Force